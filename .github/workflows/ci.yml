name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
      - name: Install pnpm
        run: npm install --global pnpm@10.17.1
      - name: Install Zig 0.16.0
        shell: bash
        run: |
          curl --fail --location --retry 3 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz --output "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm self:observe
      - run: pnpm self:observe:all
